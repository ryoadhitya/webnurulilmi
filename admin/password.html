<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Favicon: logo resmi YPI Nurul Ilmi -->
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png?v=2">
    <link rel="icon" type="image/png" sizes="48x48" href="../favicon/favicon-48x48.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="../favicon/favicon-192x192.png?v=2">
    <link rel="icon" type="image/png" sizes="any" href="../images/logonurulilmi.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png?v=2">
    <link rel="shortcut icon" type="image/png" href="../favicon/favicon-32x32.png?v=2">
    <title>Ganti Password · Panel Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/admin.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased" data-admin-page="password">
    <div class="min-h-screen lg:flex">
        <aside id="admin-sidebar" class="hidden w-64 shrink-0 border-r border-slate-200 bg-white lg:flex lg:flex-col"></aside>

        <div class="min-w-0 flex-1">
            <header id="admin-header" class="flex h-16 items-center justify-between border-b border-slate-200 bg-white px-5 sm:px-8"></header>

            <main class="mx-auto max-w-7xl px-5 py-8 sm:px-8 lg:px-10">
                <div id="admin-flash" class="hidden"></div>

                <div class="mb-8">
                    <p class="mb-2 text-xs font-bold uppercase tracking-[.18em] text-emerald-700">Keamanan akun</p>
                    <h1 class="font-display text-3xl font-extrabold tracking-tight text-slate-950 sm:text-4xl">Ganti password</h1>
                    <p class="mt-2 max-w-xl text-sm leading-6 text-slate-500">Ganti password sementara yang dipakai saat login pertama. Password baru hanya tersimpan di akun Supabase Auth Anda.</p>
                </div>

                <div id="password-error" class="mb-6 hidden rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3.5 text-sm text-rose-900 shadow-sm"></div>

                <section class="max-w-xl rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                    <form id="password-form" class="space-y-5" autocomplete="off">
                        <div>
                            <label for="current_password" class="mb-2 block text-sm font-semibold text-slate-700">Password saat ini</label>
                            <input id="current_password" name="current_password" type="password" autocomplete="current-password" required class="w-full rounded-xl border border-slate-200 bg-slate-50/70 px-4 py-3.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-emerald-600 focus:bg-white focus:ring-4 focus:ring-emerald-600/10" placeholder="Masukkan password sekarang">
                        </div>

                        <div>
                            <label for="new_password" class="mb-2 block text-sm font-semibold text-slate-700">Password baru</label>
                            <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required class="w-full rounded-xl border border-slate-200 bg-slate-50/70 px-4 py-3.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-emerald-600 focus:bg-white focus:ring-4 focus:ring-emerald-600/10" placeholder="Minimal 8 karakter">
                            <p class="mt-1 text-xs text-slate-500">Gunakan kombinasi huruf, angka, dan simbol yang sulit ditebak.</p>
                        </div>

                        <div>
                            <label for="confirm_password" class="mb-2 block text-sm font-semibold text-slate-700">Ulangi password baru</label>
                            <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required class="w-full rounded-xl border border-slate-200 bg-slate-50/70 px-4 py-3.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-emerald-600 focus:bg-white focus:ring-4 focus:ring-emerald-600/10" placeholder="Ketik ulang password baru">
                        </div>

                        <div class="flex justify-end">
                            <button type="submit" class="inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-700 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-emerald-900/10 transition hover:bg-emerald-800 focus:outline-none focus:ring-4 focus:ring-emerald-200">
                                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75M6 10.5h12a1.5 1.5 0 0 1 1.5 1.5v7.5A1.5 1.5 0 0 1 18 21H6a1.5 1.5 0 0 1-1.5-1.5v-7.5A1.5 1.5 0 0 1 6 10.5Z"/></svg>
                                Simpan password baru
                            </button>
                        </div>
                    </form>
                </section>
            </main>

            <footer class="px-5 pb-7 text-center text-xs text-slate-400 sm:px-8">© <span id="admin-year"></span> YPI Nurul Ilmi · Panel pengelola</footer>
        </div>
    </div>

    <script src="../js/vendor/supabase.min.js"></script>
    <script src="../js/site-config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/admin-auth.js"></script>
    <script src="../js/admin-layout.js"></script>
    <script src="../js/admin-password.js"></script>
    <script>
        (function () {
            var year = document.getElementById('admin-year');
            if (year) year.textContent = new Date().getFullYear();

            window.NIAdmin.mount(function () {
                window.NIAdmin.readQueryMessage();
                window.NIAdminPassword.init();
            });
        })();
    </script>
</body>
</html>
